name: train and predict

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training script
        run: python src/train.py

      - name: Build Docker image
        run: |
          docker build -t my-image-name .

      - name: Run Docker container with predict.py
        run: |
          docker run --rm my-image-name python src/predict.py


      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Docker image to DockerHub
        run: |
          docker tag my-image-name ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-image-name:latest
